<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة — سجل الغياب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="gate" id="gate">
  <div class="display" style="font-size:26px; margin-bottom:14px;">لوحة الإدارة</div>
  <div class="card">
    <div class="field">
      <label for="pinInput">رمز الدخول</label>
      <input type="password" id="pinInput" placeholder="أدخل الرمز">
    </div>
    <button class="btn-primary" id="pinSubmit" style="margin-top:14px; width:100%;">دخول</button>
    <p class="hint" id="gateError" style="display:none; color:var(--clay);">رمز غير صحيح</p>
  </div>
  <p class="hint"><a class="link-plain" href="index.html">← العودة لصفحة تسجيل الغياب</a></p>
</div>

<div class="page" id="adminApp" style="display:none;">

  <div class="cover">
    <div>
      <div class="display" id="schoolName">لوحة الإدارة</div>
      <div class="subtitle">إحصائيات وتقارير الحضور والغياب</div>
    </div>
    <div class="cover-meta">
      <a class="link-plain" href="index.html" style="color:#CBDAD6;">صفحة المعلم ←</a>
    </div>
  </div>

  <div class="card">
    <h2>نظرة عامة</h2>
    <div class="field-row">
      <div class="field">
        <label for="filterClass">الصف</label>
        <select id="filterClass"><option value="">كل الصفوف</option></select>
      </div>
      <div class="field">
        <label for="filterFrom">من تاريخ</label>
        <input type="date" id="filterFrom">
      </div>
      <div class="field">
        <label for="filterTo">إلى تاريخ</label>
        <input type="date" id="filterTo">
      </div>
    </div>
    <button class="btn-secondary" id="refreshBtn">تحديث</button>
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="card">
    <h2>سجل الحضور التفصيلي</h2>
    <div style="overflow-x:auto;">
      <table class="report" id="reportTable">
        <thead>
          <tr>
            <th>التاريخ</th><th>الصف</th><th>الطالب</th><th>الحالة</th><th>المعلم</th><th>وقت التسجيل</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
      <div class="empty-state" id="reportEmpty" style="display:none;">لا توجد سجلات ضمن هذا النطاق</div>
    </div>
    <button class="btn-secondary" id="exportBtn" style="margin-top:14px;">تصدير CSV</button>
  </div>

  <div class="card">
    <h2>إدارة الصفوف والطلاب</h2>
    <div class="field-row">
      <div class="field">
        <label for="newClassName">إضافة صف جديد</label>
        <input type="text" id="newClassName" placeholder="مثال: الصف الثاني - ب">
      </div>
      <div style="align-self:flex-end;">
        <button class="btn-secondary" id="addClassBtn">إضافة الصف</button>
      </div>
    </div>
    <div class="field-row" style="margin-top:14px;">
      <div class="field">
        <label for="studentClassSelect">الصف</label>
        <select id="studentClassSelect"></select>
      </div>
      <div class="field">
        <label for="newStudentName">اسم الطالب الجديد</label>
        <input type="text" id="newStudentName" placeholder="اسم الطالب">
      </div>
      <div style="align-self:flex-end;">
        <button class="btn-secondary" id="addStudentBtn">إضافة الطالب</button>
      </div>
    </div>
    <div class="field-row" style="margin-top:14px;">
      <div class="field">
        <label for="newTeacherName">إضافة معلم إلى القائمة</label>
        <input type="text" id="newTeacherName" placeholder="اسم المعلم">
      </div>
      <div style="align-self:flex-end;">
        <button class="btn-secondary" id="addTeacherBtn">إضافة المعلم</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
